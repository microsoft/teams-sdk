name: CI - Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'teams.md/**'
      - 'packages/cli/src/commands/**'
      - 'packages/cli/scripts/generate-command-docs.ts'
      - 'package-lock.json'

jobs:
  build-teams-md:
    name: Build teams.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI (for docs generation)
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Generate CLI command docs
        working-directory: packages/cli
        run: npm run docs:generate

      - name: Clear build artifacts
        working-directory: teams.md
        run: npm run clear

      - name: Build (teams.md)
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: teams.md
