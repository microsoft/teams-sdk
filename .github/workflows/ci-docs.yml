name: CI - Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'teams.md/**'
      - 'packages/cli/src/commands/**'
      - 'packages/cli/scripts/generate-command-docs.ts'
      - 'package-lock.json'

jobs:
  build-teams-md:
    name: Build teams.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI (for docs generation)
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Generate CLI command docs
        working-directory: packages/cli
        run: npm run docs:generate

      - name: Clear build artifacts
        working-directory: teams.md
        run: npm run clear

      - name: Build (teams.md)
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: teams.md
