name: CI - Templates

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  templates-typescript:
    name: TypeScript template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [echo, graph, tab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect template changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            templates:
              - 'packages/cli/**'
              - '.github/workflows/ci-templates.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.templates == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.templates == 'true'
        run: npm ci

      - name: Build CLI
        if: steps.changes.outputs.templates == 'true'
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Scaffold template
        if: steps.changes.outputs.templates == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP_DIR="$(node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" project new typescript app --template ${{ matrix.template }} --json | jq -r '.path')"
          echo "Scaffolded to $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install app dependencies
        if: steps.changes.outputs.templates == 'true'
        run: npm install
        working-directory: ${{ env.APP_DIR }}

      - name: Build app
        if: steps.changes.outputs.templates == 'true'
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Typecheck app
        if: steps.changes.outputs.templates == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # The tsup build does NOT typecheck, so run tsc explicitly.
          if [ "${{ matrix.template }}" = "tab" ]; then
            # tab uses project references (tsconfig.json + tsconfig.app.json + tsconfig.node.json)
            npx tsc -b --force
          else
            npx tsc --noEmit
          fi

      - name: Smoke boot
        if: steps.changes.outputs.templates == 'true' && matrix.template == 'echo'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -uo pipefail
          npm start > "$RUNNER_TEMP/boot.log" 2>&1 &
          BOOT_PID=$!
          cleanup() {
            kill "$BOOT_PID" 2>/dev/null || true
            lsof -ti tcp:3978 | xargs -r kill 2>/dev/null || true
          }
          trap cleanup EXIT
          bound=0
          for i in $(seq 1 30); do
            if nc -z localhost 3978 2>/dev/null; then
              bound=1
              echo "Port 3978 bound after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- boot log ---"
          cat "$RUNNER_TEMP/boot.log" || true
          if [ "$bound" -ne 1 ]; then
            echo "::error::TypeScript echo app did not bind port 3978"
            exit 1
          fi

      - name: No template changes
        if: steps.changes.outputs.templates != 'true'
        run: echo "No template-affecting changes in this PR. Skipping scaffold/build."

  templates-csharp:
    name: C# template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [echo]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect template changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            templates:
              - 'packages/cli/**'
              - '.github/workflows/ci-templates.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.templates == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        if: steps.changes.outputs.templates == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        if: steps.changes.outputs.templates == 'true'
        run: npm ci

      - name: Build CLI
        if: steps.changes.outputs.templates == 'true'
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Scaffold template
        if: steps.changes.outputs.templates == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP_DIR="$(node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" project new csharp app --template ${{ matrix.template }} --json | jq -r '.path')"
          echo "Scaffolded to $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build app
        if: steps.changes.outputs.templates == 'true'
        run: dotnet build
        working-directory: ${{ env.APP_DIR }}

      - name: Smoke boot
        if: steps.changes.outputs.templates == 'true' && matrix.template == 'echo'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -uo pipefail
          CSPROJ="$(find . -name '*.csproj' | head -1)"
          echo "Running $CSPROJ"
          dotnet run --project "$CSPROJ" > "$RUNNER_TEMP/boot.log" 2>&1 &
          BOOT_PID=$!
          cleanup() {
            kill "$BOOT_PID" 2>/dev/null || true
            lsof -ti tcp:3978 | xargs -r kill 2>/dev/null || true
          }
          trap cleanup EXIT
          bound=0
          for i in $(seq 1 40); do
            if nc -z localhost 3978 2>/dev/null; then
              bound=1
              echo "Port 3978 bound after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- boot log ---"
          cat "$RUNNER_TEMP/boot.log" || true
          if [ "$bound" -ne 1 ]; then
            echo "::error::C# echo app did not bind port 3978"
            exit 1
          fi

      - name: No template changes
        if: steps.changes.outputs.templates != 'true'
        run: echo "No template-affecting changes in this PR. Skipping scaffold/build."

  templates-python:
    name: Python template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [echo, graph]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect template changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            templates:
              - 'packages/cli/**'
              - '.github/workflows/ci-templates.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.templates == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        if: steps.changes.outputs.templates == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.changes.outputs.templates == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        if: steps.changes.outputs.templates == 'true'
        run: npm ci

      - name: Build CLI
        if: steps.changes.outputs.templates == 'true'
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Scaffold template
        if: steps.changes.outputs.templates == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          APP_DIR="$(node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" project new python app --template ${{ matrix.template }} --json | jq -r '.path')"
          echo "Scaffolded to $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install app (editable) + pyright
        if: steps.changes.outputs.templates == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          uv venv
          uv pip install -e .
          # pyright lives in the pyproject dev dependency-group; install it explicitly.
          uv pip install pyright

      - name: Typecheck app
        if: steps.changes.outputs.templates == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: uv run pyright

      - name: Smoke boot
        if: steps.changes.outputs.templates == 'true' && matrix.template == 'echo'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -uo pipefail
          uv run python -m src.main > "$RUNNER_TEMP/boot.log" 2>&1 &
          BOOT_PID=$!
          cleanup() {
            kill "$BOOT_PID" 2>/dev/null || true
            lsof -ti tcp:3978 | xargs -r kill 2>/dev/null || true
          }
          trap cleanup EXIT
          bound=0
          for i in $(seq 1 40); do
            if nc -z localhost 3978 2>/dev/null; then
              bound=1
              echo "Port 3978 bound after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- boot log ---"
          cat "$RUNNER_TEMP/boot.log" || true
          if [ "$bound" -ne 1 ]; then
            echo "::error::Python echo app did not bind port 3978"
            exit 1
          fi

      - name: No template changes
        if: steps.changes.outputs.templates != 'true'
        run: echo "No template-affecting changes in this PR. Skipping scaffold/build."
