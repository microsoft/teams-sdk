name: Deploy-Teams-Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'teams.md/**'
      - 'packages/cli/src/commands/**'
      - 'packages/cli/scripts/generate-command-docs.ts'
      - .github/workflows/deploy-teams-docs.yml

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push a branch
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build CLI (for docs generation)
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Generate CLI command docs
        working-directory: packages/cli
        run: npm run docs:generate

      - name: Clear build artifacts
        working-directory: teams.md
        run: npm run clear

      - name: Generate language docs
        working-directory: teams.md
        env:
          NODE_ENV: production
        run: npm run generate:docs

      - name: Generate llms.txt files
        working-directory: teams.md
        run: npm run generate:llms

      - name: Build static site
        working-directory: teams.md
        env:
          NODE_ENV: production
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: teams.md/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
