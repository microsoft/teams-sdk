name: Deploy-Teams-Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'teams.md/**'
      - 'packages/cli/src/commands/**'
      - 'packages/cli/scripts/generate-command-docs.ts'
      - .github/workflows/deploy-teams-docs.yml

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push a branch
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build CLI (for docs generation)
        run: npx turbo build --filter=@microsoft/teams.cli

      - name: Generate CLI command docs
        working-directory: packages/cli
        run: npm run docs:generate

      - name: Clear build artifacts
        working-directory: teams.md
        run: npm run clear

      - name: Generate language docs
        working-directory: teams.md
        env:
          NODE_ENV: production
        run: npm run generate:docs

      - name: Generate llms.txt files
        working-directory: teams.md
        run: npm run generate:llms

      - name: Build static site
        working-directory: teams.md
        env:
          NODE_ENV: production
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: teams.md/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
